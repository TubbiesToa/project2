        .form-control, .form-select { background-color: #4B2D08; border: 1px solid #FFD966; color: #FFD966; }
        .btn-geel { background-color: #FFD966; color: #4B2D08; font-weight: bold; }
        footer { background-color: #3a2206; border-top: 5px solid #FFD966; }
    </style>
</head>

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #3a2206;">

    </nav>

    <div class="container my-5">
        <h1>Contact</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="box">
                    <h2>Gegevens</h2>
                    <p><i class="bi bi-envelope"></i> tturlinckx@gmail.com</p>
                </div>
            </div>
            <div class="col-md-8">
                <div class="box">
                    <h2>Stuur een bericht</h2>
                    <form action="https://tm-statweb.be/forms.php" method="post" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Naam (verplicht)</label>
                            <input type="text" class="form-control" name="naampers" required>
                            <div class="invalid-feedback">Vul je naam in.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail (verplicht)</label>
                            <input type="email" class="form-control" name="mailpers" required>
                            <div class="invalid-feedback">Vul een geldig e-mailadres in.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Interesse</label>
                            <select class="form-select" name="interessepers" required>
                                <option value="">Kies...</option>
                                <option value="HTML">HTML</option>
                                <option value="CSS">CSS</option>
                                <option value="Python">Python</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Vraag</label>
                            <textarea class="form-control" name="Berichtpers" rows="4" required></textarea>
                            <div class="invalid-feedback">Typ je vraag.</div>
                        </div>
                        <button type="submit" class="btn btn-geel">Verzenden</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 mt-auto">
        <div class="container">

                    <a href="#" class="text-warning"><i class="bi bi-twitter fs-4"></i></a>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
